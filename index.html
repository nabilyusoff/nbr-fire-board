ts/d/1sruZ71itoN3joxhaOTcO1DUm8zF4XbxgNEyASBaTQVM/edit", "notices": "https://docs.google.com/spreadsheets/d/1IeejJAvLHRaiVb8t-k9Yoytqq1SpfhZf5kKEiAy8cPY/edit#gid=941609921", "contacts": "https://docs.google.com/spreadsheets/d/1IeejJAvLHRaiVb8t-k9Yoytqq1SpfhZf5kKEiAy8cPY/edit#gid=787805822", "app": "", "photos": "https://drive.google.com/drive/folders/18-sm7HIYPv0PzqbLvY6Fpe02gHKQ5Ifs"} 15

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fire Alarm Board</title>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --cream:#F3E7CF; --surface:#FBF6EC; --panel:#E9D2BA; --ink:#1C1A17; --muted:#6B6253;
    --rule:#CDBFA6; --coral:#FF5E3B; --red:#8A0323; --sky:#86A3D0; --olive:#987B00;
    --wheat:#DBB39B; --green:#2F7D4F;
    --display:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font:400 15px/1.5 var(--display)}
  .band{background:var(--red);color:var(--cream)}
  .in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
      padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mast{padding-block:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .mast h1{margin:0;font-weight:300;font-size:clamp(22px,4.2vw,30px);letter-spacing:-.02em;line-height:1.05}
  .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fresh{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(243,231,207,.18)}
  .fresh.stale{background:var(--olive);color:#fff}
  button.rf{font:inherit;font-size:13px;padding:7px 14px;border-radius:7px;cursor:pointer;
            border:1px solid var(--cream);background:transparent;color:var(--cream)}
  button.rf:hover{background:var(--cream);color:var(--red)}
  button.rf[disabled]{opacity:.55;cursor:default}
  .auto{font-size:11px;opacity:.8;display:flex;align-items:center;gap:5px}
  main{padding-block:0 60px}

  /* compact links row */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chips a{font-size:12.5px;text-decoration:none;color:var(--ink);background:var(--surface);
           border:1px solid var(--rule);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .chips a:hover{border-color:var(--ink)}
  .chips a span{color:var(--coral);margin-left:4px}

  /* today card */
  .today{margin-top:16px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;
         padding:20px 22px 18px}
  .today .lead{font-size:clamp(17px,2.6vw,21px);font-weight:300;letter-spacing:-.01em;line-height:1.35;margin:0}
  .today .lead b{font-weight:500}
  .stats{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);margin-top:16px}
  @media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
  .st{border:1px solid var(--rule);border-radius:6px;padding:10px 12px 11px;background:var(--cream)}
  .st .n{font-weight:300;font-size:30px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;display:block}
  .st .t{color:var(--muted);font-size:12px;margin-top:5px;display:block;line-height:1.3}
  .st.alert .n{color:var(--red)}
  .do{margin-top:18px}
  .do h3{margin:0 0 8px}
  ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .fi{border-left:3px solid var(--rule);padding:1px 0 1px 11px}
  .fi.act{border-left-color:var(--red)}
  .fi.warn{border-left-color:var(--olive)}
  .fi.info{border-left-color:var(--sky)}
  .fi .t{display:block;font-size:14px;line-height:1.4}
  .fi .t b{font-weight:500}
  .fi .d{display:block;color:var(--muted);font-size:12.5px;margin-top:1px;line-height:1.45}
  .fi .mv{display:block;font-size:12.5px;margin-top:2px;color:var(--red)}
  .tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
       padding:1px 6px;border-radius:3px;margin-right:6px;vertical-align:1px;color:#fff}
  .tag.alma{background:#B5775A}.tag.nbr{background:#6B7FA3}
  .more{font:inherit;font-size:13px;color:var(--red);background:none;border:0;padding:6px 0 0;cursor:pointer;text-decoration:underline}

  /* headings */
  h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:30px 0 10px}
  h3{font-size:14.5px;font-weight:500;margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .cnt{font-family:var(--mono);font-size:11px;color:var(--cream);background:var(--ink);border-radius:999px;padding:2px 8px}
  .cnt.zero{background:var(--rule);color:var(--ink)}
  .cnt.hot{background:var(--red)}
  .sum{color:var(--muted);font-weight:400;font-size:12.5px}

  /* two sides */
  .split{display:grid;gap:16px;grid-template-columns:1fr 1fr;margin-top:16px;align-items:start}
  @media(max-width:940px){.split{grid-template-columns:1fr}}
  .side{border:1px solid var(--rule);border-radius:8px;background:var(--surface);overflow:hidden}
  .side .hd{padding:14px 18px 12px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;
            align-items:flex-end;gap:12px;flex-wrap:wrap}
  .side.alma .hd{background:#F0DCCB}
  .side.nbr .hd{background:#E3E7EF}
  .side .hd h2{margin:0;font-size:18px;letter-spacing:-.01em;text-transform:none;color:var(--ink);font-weight:500}
  .side .hd .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .side .hd .big{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;line-height:1.55}
  .side .hd .big b{color:var(--ink);font-size:19px;font-weight:300;letter-spacing:-.03em}

  /* collapsible blocks */
  details.blk{border-bottom:1px solid var(--rule)}
  details.blk:last-child{border-bottom:0}
  details.blk>summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;align-items:center;gap:10px}
  details.blk>summary::-webkit-details-marker{display:none}
  details.blk>summary:hover{background:rgba(0,0,0,.025)}
  details.blk>summary .chev{margin-left:auto;color:var(--muted);font-size:12px;transition:transform .15s;flex:none}
  details.blk[open]>summary .chev{transform:rotate(90deg)}
  details.blk>summary h3{flex:1;min-width:0}
  details.blk>.body{padding:2px 18px 16px}
  .empty{padding:4px 0 2px;color:var(--muted);font-size:13.5px}
  .note{color:var(--muted);font-size:12.5px;line-height:1.65;margin-top:10px}
  .note a,.body a,.today a{color:var(--red)}

  /* new triggers grouped by day */
  .day{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
       margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
  .day:first-child{margin-top:4px}
  .ev{display:grid;grid-template-columns:62px 1fr auto;gap:4px 10px;padding:7px 0;align-items:baseline}
  .ev+.ev{border-top:1px dashed var(--rule)}
  .ev.unseen{background:#FFF3EE;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:4px}
  .ev .tm{font-family:var(--mono);font-size:12.5px}
  .ev .wh{font-size:14px}
  .ev .wh .z{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:6px}
  .ev .ca{grid-column:2;color:var(--muted);font-size:12.5px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;color:#fff;white-space:nowrap;font-weight:500}
  .new{background:var(--coral);color:#fff;padding:1px 7px;border-radius:999px;font-size:10px;margin-left:6px;
       font-family:var(--mono);letter-spacing:.05em;vertical-align:1px}

  /* recurring rows */
  .rr{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 0;align-items:start}
  .rr+.rr{border-top:1px solid var(--rule)}
  .rr .rl b{font-weight:500;font-size:14.5px}
  .rr .rs{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.5}
  .rr .rs .crit{color:var(--red);font-weight:500}
  .rr .rn{text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.2;padding-top:2px}
  .rr .rn b{display:block;font-family:var(--display);font-weight:300;font-size:28px;letter-spacing:-.04em;color:var(--ink);
            font-variant-numeric:tabular-nums}
  .rr .rn b.crit{color:var(--red)}
  .z{color:var(--muted);font-family:var(--mono);font-size:11px}

  /* whatsapp */
  button.wa{font:inherit;font-size:12px;padding:4px 10px 4px 8px;border-radius:999px;cursor:pointer;
            border:1px solid var(--green);background:#fff;color:var(--green);white-space:nowrap;
            display:inline-flex;align-items:center;gap:5px;vertical-align:middle;margin-left:8px}
  button.wa:hover{background:var(--green);color:#fff}
  button.wa svg{width:13px;height:13px;fill:currentColor}
  button.wa.nocontact{border-style:dashed}
  .watch{color:var(--muted);font-size:13px;line-height:1.75}
  .watch .z{margin-left:6px}

  /* photos */
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .thumbs a{display:block;width:68px;height:68px;border-radius:4px;overflow:hidden;border:1px solid var(--rule);background:var(--panel)}
  .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:6px}
  .pgrid .ph{font-size:12.5px}
  .pgrid .ph .nm{font-weight:500;display:block;margin-bottom:2px}
  .pgrid .thumbs a{width:100%;height:110px}

  /* to-do */
  .todo{list-style:none;margin:0;padding:0}
  .todo li{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
  .todo li:last-child{border-bottom:0}
  .todo .tx{flex:1;min-width:0}
  .todo .done .tx{text-decoration:line-through;color:var(--muted)}
  .todo .wh{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
  .todo .tick{width:16px;height:16px;flex:none;margin-top:4px;border:1.5px solid var(--rule);border-radius:3px;display:inline-block}
  .todo .done .tick{background:var(--red);border-color:var(--red)}
  .editrow{text-align:right;padding-top:10px}
  .editrow a{font-size:13px;color:var(--red);text-decoration:none}
  .editrow a:hover{text-decoration:underline}

  /* more detail */
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:8px}
  details.wide>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:10px}
  details.wide>summary::-webkit-details-marker{display:none}
  details.wide>summary .chev{margin-left:auto;color:var(--muted);font-size:12px;transition:transform .15s}
  details.wide[open]>summary .chev{transform:rotate(90deg)}
  details.wide>.body{padding:0 18px 18px}
  .two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
  @media(max-width:760px){.two{grid-template-columns:1fr}}
  .box{border:1px solid var(--rule);border-radius:6px;padding:14px 16px;background:var(--cream)}
  .box h2{margin:0 0 10px}
  .crow{display:grid;grid-template-columns:minmax(0,auto) 1fr 32px;gap:11px;align-items:center;padding:5px 0}
  .ctrack{height:9px;background:var(--panel);border-radius:2px;overflow:hidden}
  .ctrack div{height:100%}
  .chart{display:flex;align-items:flex-end;gap:6px;height:104px;padding-top:6px}
  .wbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;gap:5px}
  .wbar>div{background:var(--sky);border-radius:2px 2px 0 0;min-height:2px}
  .wbar span{text-align:center;font-size:10px;color:var(--muted)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
  select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--surface);color:var(--ink)}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
  th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
     padding:9px 10px;background:var(--panel);white-space:nowrap}
  td{padding:9px 10px;border-top:1px solid var(--rule);vertical-align:top}
  tr.unseen td{background:#FFF3EE}
  .mono{font-family:var(--mono);font-size:12.5px}
  .dim{color:var(--muted)}

  /* monthly chart */
  .mchart{padding:16px 18px 10px}
  .mtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .mtop .lead{font-size:14.5px;margin:0}
  .mtop .lead b{font-weight:500}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .legend i.todate{background:rgba(107,98,83,.25);border:1.5px solid var(--muted)}
  .msvg{width:100%;height:auto;display:block;overflow:visible}
  .msvg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
  .msvg text.v{fill:var(--ink);font-size:10.5px}
  .msvg line.grid{stroke:var(--rule);stroke-width:1}
  .msvg line.base{stroke:var(--muted);stroke-width:1}
  .msvg rect.hit{cursor:default}
  .msvg g:hover path.bar{filter:brightness(.85)}
  .mtip{position:absolute;pointer-events:none;background:var(--ink);color:var(--cream);font-size:12.5px;
        padding:7px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5}
  .mtip b{font-weight:500}
  .mwrap{position:relative}
  .mnote{color:var(--muted);font-size:12px;margin:6px 0 4px}

/* ---------- helpers ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];

function colour(cat) { return COLOUR[cat] || 'var(--wheat)'; }
function pill(cat) { return '<span class="pill" style="background:' + colour(cat) + '">' + esc(cat) + '</span>'; }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
/* Same rule as fa-publish.loc_token: the part of a location people actually type. */
function tok(s) {
  s = String(s || '');
  var m = s.match(/#\s*0?(\d{1,2})-(\d{2}(?:\/\d{2})?)/);
  if (m) return '#' + ('0' + m[1]).slice(-2) + '-' + m[2];
  m = s.match(/#\s*(\d{3})\b/);
  if (m) return '#' + m[1];
  m = s.match(/\bZA\s*(\d{2})-(\d{2})\b/i);
  if (m) return 'za' + m[1] + '-' + m[2];
  return s.trim().toLowerCase().replace(/\s+/g, ' ');
}
function dmy(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? m[3] + ' ' + MONTHS[+m[2] - 1] : (iso || '');
}
function dayLabel(a) {
  if (a.ago === 0) return 'Today';
  if (a.ago === 1) return 'Yesterday';
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(a.date || '');
  if (!m) return a.date;
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return DAYS[d.getUTCDay()] + ' ' + m[3] + ' ' + MONTHS[+m[2] - 1];
}

    if (d !== last) { h += '<div class="day">' + esc(d) + '</div>'; last = d; }
    h += '<div class="ev' + (unseen(a) ? ' unseen' : '') + '"><span class="tm">' + esc(a.time) + '</span>' +
      '<span class="wh">' + esc(isAlma ? shortLoc(a.where) : a.where) + (a.zone ? '<span class="z">' + esc(a.zone) + '</span>' : '') +
      (unseen(a) ? '<span class="new">NEW</span>' : '') + '</span>' + pill(a.cat) +
      '<span class="ca">' + esc(a.cause) + '</span></div>';
  });
  return h;
}
function recurring(open, isNbr, isAlma) {
  if (!open.length) return '<div class="empty">Nothing is triggering repeatedly.</div>';
  return open.map(function (x) {
    var ni = isNbr ? noticeFor(x.where) : -1;
    var hot = x.n30 >= 3;
    return '<div class="rr"><div class="rl"><b>' + esc(isAlma ? shortLoc(x.where) : x.where) + '</b>' +
      (x.grouping === 'zone' ? ' <span class="z">zone</span>' : '') + (ni >= 0 ? waButton(ni) : '') +
      '<div class="rs">' + x.n90 + ' in 90 days' + (x.latest ? ' · latest ' + esc(x.latest) : '') + (x.cause ? ' · ' + esc(x.cause.toLowerCase()) : '') +
      (x.needs || x.status ? '<br>' + esc([x.needs, x.status].filter(Boolean).join(' · ')) : '') + '</div>' +
      thumbs(x.where) + '</div>' +
      '<div class="rn"><b' + (hot ? ' class="crit"' : '') + '>' + x.n30 + '</b>in 30 days</div></div>';
  }).join('') + '<div class="note">A <b>zone</b> row groups the rooms behind one detector group. Photos under a location come from its Drive folder.</div>';
}
function notices() {
  var due = DATA.notices.filter(function (n) { return n.status === 'due'; });
  var watch = DATA.notices.filter(function (n) { return n.status === 'watching'; });
  var h = '';
  if (!due.length && !watch.length) h += '<div class="empty">No behavioural triggers at a tenant since 1 October.</div>';
  if (due.length) {
    h += '<ul class="plain">' + due.map(function (n) {
      var i = DATA.notices.indexOf(n);
      return '<li class="fi act"><span class="t"><b>' + esc(n.where) + '</b>' + waButton(i) + '</span>' +
        '<span class="d">' + n.n + ' behavioural triggers to notify. Latest ' + esc(dmy(n.latest)) + ' at ' + esc(n.time) + ', ' + esc(n.cause.toLowerCase()) +
        (n.prev ? '. Previous ' + esc(dmy(n.prev)) : '') + (n.sent ? '. Last notice ' + esc(dmy(n.sent)) : '') + '.</span>' +
        '<span class="d">' + (n.contact ? esc(n.contact) : 'No contact on file') + '</span></li>';
    }).join('') + '</ul>';
  }
  if (watch.length) {
    h += '<div class="day" style="margin-top:' + (due.length ? 16 : 4) + 'px">Watching · one trigger so far</div><div class="watch">' +
      watch.map(function (n) { return esc(n.where) + '<span class="z">' + esc(dmy(n.latest)) + ', ' + esc(n.cause.toLowerCase()) + '</span>'; }).join('<br>') + '</div>';
  }
  h += '<div class="note">The button opens WhatsApp with the notice filled in when a number or group link is in the <a href="' + esc(LINK.contacts) +
    '" target="_blank" rel="noopener">Contacts</a> tab, otherwise it copies the text. After sending, log the date in <a href="' + esc(LINK.notices) +
    '" target="_blank" rel="noopener">WhatsApp notices</a> and that unit’s count restarts.</div>';
  return h;
}
function photosFor(isAlma) {
  var folders = Object.keys(DATA.photos).filter(function (k) { return (/alma/i.test(DATA.photos[k][0].folder)) === isAlma; }).sort();
  if (!folders.length) {
    return '<div class="empty">No photos yet. Open <a href="' + esc(LINK.photos) + '" target="_blank" rel="noopener">the Drive folder</a>, pick the location’s folder and upload from your phone. It shows here within the hour.</div>';
  }
  return '<div class="pgrid">' + folders.map(function (k) {
    var f = DATA.photos[k];
    return '<div class="ph"><span class="nm">' + esc(f[0].folder) + '</span><span class="z">' + plural(f.length, 'photo') +
      (f[f.length - 1].when ? ' · latest ' + esc(f[f.length - 1].when) : '') + '</span>' + thumbs(f[0].folder, true) + '</div>';
  }).join('') + '</div>';
}

/* ---------- one side ---------- */
function sideHtml(sd) {
  var isAlma = sd.key === 'Alma House', isNbr = !isAlma;
  var all = byArea(sd.key);
  var r30 = all.filter(function (a) { return a.ago <= 30; });
  var r7 = all.filter(function (a) { return a.ago <= 7; });
  var nNew = r7.filter(unseen).length;
  var know = DATA.flags.filter(function (x) { return x.area === sd.key && x.sev !== 'act'; });
  var open = DATA.open.filter(function (x) { return x.area === sd.key; });
  var folders = Object.keys(DATA.photos).filter(function (k) { return (/alma/i.test(DATA.photos[k][0].folder)) === isAlma; });
  var due = isNbr ? DATA.notices.filter(function (n) { return n.status === 'due'; }).length : 0;
  var watch = isNbr ? DATA.notices.filter(function (n) { return n.status === 'watching'; }).length : 0;

  var h = '<div class="hd"><div><h2>' + esc(sd.name) + '</h2><div class="sub">' + esc(sd.sub) + '</div></div>' +
    '<div class="big"><b>' + r7.length + '</b> in 7 days · <b>' + r30.length + '</b> in 30' +
    (nNew ? '<br><span class="new" style="margin:0">' + nNew + ' NEW</span> since your last visit' : '') + '</div></div>';

  var worst = open[0];
  h += block(sd.id + '-new', 'New triggers', r7.length, 'last 7 days', newTriggers(r7, isAlma), true, nNew > 0);
  h += block(sd.id + '-rec', 'Recurring', open.length,
    open.length ? (worst ? 'worst ' + esc(isAlma ? shortLoc(worst.where) : worst.where.replace(/ — .*$/, '')) + ', ' + worst.n30 + ' in 30 days' : '') : '3 or more in 90 days',
    recurring(open, isNbr, isAlma), false, open.some(function (x) { return x.n30 >= 3; }));
  if (isNbr) {
    h += block('nbr-wa', 'WhatsApp notices', due ? due + ' due' : (watch ? watch + ' watching' : 0),
      due ? watch + ' watching' : 'behavioural since 1 Oct 2026', notices(), due > 0, due > 0);
  }
  h += block(sd.id + '-know', 'Worth knowing', know.length, 'not urgent',
    know.length ? flagItems(know) : '<div class="empty">Nothing else to note.</div>', false, false);
  h += block(sd.id + '-ph', 'Detector photos', folders.length, folders.length ? 'locations with photos' : 'drop photos in Drive',
    photosFor(isAlma), folders.length > 0, false);
  return h;
}

/* ---------- WhatsApp ---------- */
function waText(n) {
  var who = n.contact ? n.contact : (n.tenant || 'there');
  var unit = n.where.replace(/ — .*$/, '');
  return 'Hi ' + who + ', Nabil from New Bahru Estate Operations.\n\n' +
    'The fire alarm was activated again at ' + unit + ' on ' + dmy(n.latest) + ' at ' + n.time + ', traced to ' + n.cause.toLowerCase() +
    '. This is the ' + (n.n === 2 ? 'second' : n.n + 'th') + ' time since October' + (n.prev ? ' — the previous one was ' + dmy(n.prev) : '') + '.\n\n' +
    'Each activation brings Security to your unit and carries a risk of an SCDF turn-out, so we would like to stop it happening again.\n\n' +
    'Two things:\n' +
    '1. Message us a day before any works, fumigation, or first use of equipment that makes heat or steam, and we will isolate the zone. No charge, and no alarm.\n' +
    '2. If the detector is simply too close to a hob, a steamer or a bathroom, tell us and we will look at relocating it. That is ours to fix.\n\n' +
    'Where an activation is traced to a unit and was not notified in advance, any SCDF charge or make-good cost is recovered from the unit. We would much rather isolate a zone for an afternoon than send anyone a bill.\n\n' +
    'Happy to come up and look at it with you.';
}
var toastTimer = null;
function toast(html) {
  var el = document.getElementById('toast');
  el.innerHTML = html; el.className = 'toast on';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = 'toast'; }, 7000);
}
function copyText(t, done) {
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { done(true); }, function () { done(false); });
  } else { done(false); }
}
function waOpen(i) {
  var n = DATA.notices[i];
  if (!n) return;
  var text = waText(n);
  var link = String(n.wa || '').trim();
  var digits = link.replace(/[^\d]/g, '');
  if (/^\+?[\d\s()-]{8,}$/.test(link) && digits.length >= 8) {
    if (digits.length === 8) digits = '65' + digits;
    window.open('https://wa.me/' + digits + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
    return;
  }
  if (/^https?:\/\/(api\.whatsapp\.com|wa\.me)\//i.test(link) && !/text=/.test(link)) {
    window.open(link + (link.indexOf('?') < 0 ? '?' : '&') + 'text=' + encodeURIComponent(text), '_blank', 'noopener');
    return;
  }
  copyText(text, function (ok) {
    if (link) {
      toast((ok ? 'Notice copied. Paste it into the chat.' : 'Could not copy automatically.') + ' Opening the group…');
      window.open(link, '_blank', 'noopener');
    } else {
      toast((ok ? 'Notice copied to your clipboard. ' : 'Could not copy automatically. ') +
        'No contact for this unit yet — add the group link or number in the <a href="' + esc(LINK.contacts) + '" target="_blank" rel="noopener">Contacts</a> tab.');
    }
  });
}

/* ---------- monthly chart: Alma House against New Bahru, grouped bars ---------- */
var SERIES = [
  { k: 'alma', name: 'Alma House', c: '#D9512A' },
  { k: 'nbr', name: 'New Bahru', c: '#3A67AD' }
];
function monthLabel(m, prevYear) {          /* 2026-11 -> Nov, or Nov 26 when the year changes */
  var y = m.slice(0, 4), mo = MONTHS[+m.slice(5, 7) - 1];
  return mo + (y !== prevYear ? ' ' + y.slice(2) : '');
}
function monthName(m) { return MONTHS[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4); }
function monthly() {
  var all = DATA.monthly || [];
  var el = document.getElementById('monthly');
  if (!all.length) { el.innerHTML = '<div class="empty">No monthly figures yet.</div>'; return; }
  var rows = all.slice(-13);                 /* this month to date plus the twelve before it */
  var cur = rows[rows.length - 1], prev = rows.length > 1 ? rows[rows.length - 2] : null;
  var mx = 1;
  rows.forEach(function (r) { mx = Math.max(mx, r.alma, r.nbr); });
  var step = mx > 40 ? 20 : mx > 20 ? 10 : 5;
  var top = Math.ceil(mx / step) * step;

  var W = 980, H = 230, L = 34, R = 10, T = 14, B = 34;
  var pw = W - L - R, ph = H - T - B;
  var gw = pw / rows.length, bw = Math.min(16, (gw - 10) / 2), gap = 2;
  function y(v) { return T + ph - (v / top) * ph; }
  var s = '<svg class="msvg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Monthly fire alarm activations, Alma House against New Bahru">';
  /* a bar rounded at the data end only, square on the baseline */
  function barPath(x, yTop, w, h) {
    var r = Math.min(3, h / 2, w / 2), base = T + ph;
    return 'M' + x.toFixed(1) + ',' + base.toFixed(1) + 'V' + (yTop + r).toFixed(1) +
      'a' + r + ',' + r + ' 0 0 1 ' + r + ',-' + r + 'h' + (w - 2 * r).toFixed(1) +
      'a' + r + ',' + r + ' 0 0 1 ' + r + ',' + r + 'V' + base.toFixed(1) + 'Z';
  }
  for (var g = 0; g <= top; g += step) {
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g).toFixed(1) + '" y2="' + y(g).toFixed(1) + '"/>' +
         '<text x="' + (L - 6) + '" y="' + (y(g) + 4).toFixed(1) + '" text-anchor="end">' + g + '</text>';
  }
  var prevYear = '';
  rows.forEach(function (r, i) {
    var cx = L + gw * i + gw / 2;
    var last = i === rows.length - 1;
    SERIES.forEach(function (sr, j) {
      var v = r[sr.k];
      var x = cx + (j === 0 ? -bw - gap / 2 : gap / 2);
      var h = Math.max(v ? 2 : 0, (v / top) * ph);
      var yy = T + ph - h;
      s += '<g class="bar' + (last ? ' todate' : '') + '" data-m="' + esc(r.m) + '" data-s="' + esc(sr.name) + '" data-v="' + v + '">' +
           (h ? '<path class="bar" d="' + barPath(x, yy, bw, h) + '" fill="' + sr.c + '"' +
             (last ? ' fill-opacity=".3" stroke="' + sr.c + '" stroke-width="1.5"' : '') + '/>' : '') +
           ((last || (prev && r === prev)) && v ? '<text class="v" x="' + (x + bw / 2).toFixed(1) + '" y="' + (yy - 4).toFixed(1) + '" text-anchor="middle">' + v + '</text>' : '') +
           '<rect class="hit" fill="none" pointer-events="all" x="' + (x - 2).toFixed(1) + '" y="' + T + '" width="' + (bw + 4).toFixed(1) + '" height="' + ph + '"/>' +
           '</g>';
    });
    s += '<text x="' + cx.toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle">' + esc(monthLabel(r.m, prevYear)) + '</text>';
    prevYear = r.m.slice(0, 4);
  });
  s += '<line class="base" x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '"/></svg>';

  var lead = '<b>' + esc(monthName(cur.m)) + '</b> so far: Alma House ' + cur.alma + ', New Bahru ' + cur.nbr +
    (prev ? '. <b>' + esc(monthName(prev.m)) + '</b>: Alma House ' + prev.alma + ', New Bahru ' + prev.nbr + '.' : '.');
  el.innerHTML = '<div class="mtop"><p class="lead">' + lead + '</p><div class="legend">' +
    SERIES.map(function (sr) { return '<span><i style="background:' + sr.c + '"></i>' + esc(sr.name) + '</span>'; }).join('') +
    '<span><i class="todate"></i>month to date</span></div></div>' +
    '<div class="mwrap">' + s + '<div class="mtip" id="mtip"></div></div>' +
    '<div class="mnote">Hover a bar for the figure. Every month since the log began is in the table under More detail.</div>';

  /* the table: every month */
  var tb = document.getElementById('mtbl');
  tb.innerHTML = '<table style="min-width:360px"><tr><th>Month</th><th style="text-align:right">Alma House</th><th style="text-align:right">New Bahru</th><th style="text-align:right">Total</th></tr>' +
    all.slice().reverse().map(function (r, i) {
      return '<tr><td>' + esc(monthName(r.m)) + (i === 0 ? ' <span class="z">to date</span>' : '') + '</td><td class="mono" style="text-align:right">' + r.alma +
        '</td><td class="mono" style="text-align:right">' + r.nbr + '</td><td class="mono" style="text-align:right">' + (r.alma + r.nbr) + '</td></tr>';
    }).join('') + '</table>';
}
function monthlyHover(ev, on) {
  var g = ev.target;
  while (g && g !== document && !(g.getAttribute && g.getAttribute('data-m'))) { g = g.parentNode; }
  var tip = document.getElementById('mtip');
  if (!tip) return;
  if (!on || !g || g === document) { tip.style.display = 'none'; return; }
  var wrap = tip.parentNode, box = wrap.getBoundingClientRect ? wrap.getBoundingClientRect() : { left: 0, top: 0 };
  tip.innerHTML = '<b>' + esc(g.getAttribute('data-s')) + '</b> · ' + esc(monthName(g.getAttribute('data-m'))) + ': ' + esc(g.getAttribute('data-v')) +
    (g.getAttribute('class') && g.getAttribute('class').indexOf('todate') >= 0 ? ' so far' : '');
  tip.style.left = (ev.clientX - box.left) + 'px';
  tip.style.top = (ev.clientY - box.top - 8) + 'px';
  tip.style.display = 'block';
}

/* ---------- more detail ---------- */
function cats() {
  var r = DATA.acts.filter(function (a) { return a.ago <= 30; });
  var by = {};
  r.forEach(function (a) { by[a.cat] = (by[a.cat] || 0) + 1; });
  var keys = Object.keys(by).sort(function (x, y) { return by[y] - by[x]; });
  var tot = r.length || 1;
  document.getElementById('cats').innerHTML = keys.map(function (k) {
    return '<div class="crow"><span>' + esc(k) + '</span><div class="ctrack"><div style="width:' + (by[k] / tot * 100).toFixed(1) +
      '%;background:' + colour(k) + '"></div></div><span class="mono" style="text-align:right">' + by[k] + '</span></div>';
  }).join('') || '<div class="empty">Nothing in the last 30 days.</div>';
}
function weeks() {
  var b = [], w;
  for (w = 9; w >= 0; w--) { b.push(DATA.acts.filter(function (a) { return Math.floor(a.ago / 7) === w; }).length); }
  var mx = Math.max.apply(null, b.concat([1]));
  document.getElementById('wk').innerHTML = b.map(function (n) {
    return '<div class="wbar"><div style="height:' + Math.round(n / mx * 100) + '%"></div><span class="mono">' + (n || '') + '</span></div>';
  }).join('');
}
function table() {
  var area = document.getElementById('fArea').value;
  var cat = document.getElementById('fCat').value;
  var days = +document.getElementById('fDays').value || 30;
  var r = DATA.acts.filter(function (a) { return (!area || a.area === area) && (!cat || a.cat === cat) && a.ago <= days; });
  var el = document.getElementById('tbl');
  if (!r.length) { el.innerHTML = '<div class="empty" style="padding:12px 0">Nothing matches.</div>'; return; }
  el.innerHTML = '<table><tr><th>Date</th><th>Time</th><th>Area</th><th>Location</th><th>Cause</th><th>Category</th></tr>' +
    r.map(function (a) {
      return '<tr' + (unseen(a) ? ' class="unseen"' : '') + '><td class="mono">' + esc(a.date) + (unseen(a) ? '<span class="new">NEW</span>' : '') +
        '</td><td class="mono">' + esc(a.time) + '</td><td>' + esc(a.area) + '</td><td>' + esc(a.where) + '</td><td>' + esc(a.cause) + '</td><td>' + pill(a.cat) + '</td></tr>';
    }).join('') + '</table>';
}
function todo() {
  var el = document.getElementById('todo');
  var t = DATA.todo || [];
  if (!t.length) { el.innerHTML = '<li style="color:var(--muted);padding:12px 0">Nothing on your list. Add to it in the sheet.</li>'; return; }
  var openFirst = t.filter(function (x) { return !x.done; }).concat(t.filter(function (x) { return x.done; }));
  el.innerHTML = openFirst.map(function (x) {
    return '<li class="' + (x.done ? 'done' : '') + '"><span class="tick"></span><span class="tx">' + esc(x.task) +
      (x.where ? '<span class="wh">' + esc(x.where) + '</span>' : '') + '</span></li>';
  }).join('');
}

function draw() {
  today();
  SIDES.forEach(function (sd) { document.getElementById(sd.id).innerHTML = sideHtml(sd); });
  monthly(); cats(); weeks(); table();
}

(function () {
  var btn = document.getElementById('refresh');
  var auto = document.getElementById('autoref');
  var timer = null;
  function go() { btn.disabled = true; btn.textContent = 'Refreshing'; location.reload(); }
  btn.onclick = go;
  function arm() {
    if (timer) { clearInterval(timer); }
    if (auto.checked) { timer = setInterval(go, AUTO_MIN * 60000); }
    try { localStorage.setItem('fa-auto', auto.checked ? '1' : '0'); } catch (e) {}
  }
  try { if (localStorage.getItem('fa-auto') === '0') { auto.checked = false; } } catch (e) {}
  auto.onchange = arm;
  arm();

  var cs = [];
  DATA.acts.forEach(function (a) { if (a.cat && cs.indexOf(a.cat) < 0) { cs.push(a.cat); } });
  cs.sort();
  document.getElementById('fCat').innerHTML = '<option value="">Every category</option>' +
    cs.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
  ['fArea', 'fCat', 'fDays'].forEach(function (id) { document.getElementById(id).onchange = table; });

  if (document.addEventListener) {
    /* WhatsApp buttons, wherever they are drawn */
    document.addEventListener('click', function (ev) {
      var b = ev.target;
      while (b && b !== document && !(b.getAttribute && b.getAttribute('data-n'))) { b = b.parentNode; }
      if (b && b !== document && b.getAttribute) { waOpen(+b.getAttribute('data-n')); }
    });
    /* monthly chart tooltip */
    document.addEventListener('mousemove', function (ev) { monthlyHover(ev, true); });
    document.addEventListener('mouseout', function (ev) { monthlyHover(ev, false); });
    /* remember which blocks were left open; the toggle event does not bubble, so listen in capture */
    document.addEventListener('toggle', function (ev) {
      var d = ev.target;
      if (!d || !d.id || d.id.indexOf('d-') !== 0 || !d.classList || !d.classList.contains('blk')) return;
      OPEN[d.id.slice(2)] = !!d.open;
      try { localStorage.setItem('fa-open', JSON.stringify(OPEN)); } catch (e) {}
    }, true);
  }

  head(); todo(); draw();
  rememberSeen();
})();
</script>
</body>
</html>
