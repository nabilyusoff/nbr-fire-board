<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --cream:#F3E7CF; --surface:#FBF6EC; --panel:#E9D2BA; --ink:#1C1A17; --muted:#6B6253;
    --rule:#CDBFA6; --coral:#FF5E3B; --red:#8A0323; --sky:#86A3D0; --olive:#987B00;
    --wheat:#DBB39B; --green:#2F7D4F;
    --display:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font:400 15px/1.55 var(--display)}
  .band{background:var(--red);color:var(--cream)}
  .in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
      padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mast{padding-block:18px;display:flex;align-items:center;justify-content:space-between;
        gap:14px;flex-wrap:wrap}
  .mast h1{margin:0;font-weight:300;font-size:clamp(23px,4.4vw,32px);letter-spacing:-.02em;
           line-height:1.05}
  .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fresh{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:999px;
         background:rgba(243,231,207,.18)}
  .fresh.stale{background:var(--olive);color:#fff}
  button.rf{font:inherit;font-size:13px;padding:7px 14px;border-radius:7px;cursor:pointer;
            border:1px solid var(--cream);background:transparent;color:var(--cream)}
  button.rf:hover{background:var(--cream);color:var(--red)}
  button.rf:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  button.rf[disabled]{opacity:.55;cursor:default}
  .auto{font-size:11px;opacity:.8;display:flex;align-items:center;gap:5px}
  main{padding-block:0 60px}
  .jump{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin-top:18px}
  @media(max-width:900px){.jump{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.jump{grid-template-columns:1fr}}
  .jump a{display:flex;align-items:center;justify-content:space-between;gap:10px;
          text-decoration:none;background:var(--surface);border:1px solid var(--rule);
          border-left:4px solid var(--coral);border-radius:4px;padding:14px 16px;color:var(--ink)}
  .jump a:hover{border-color:var(--ink)}
  .jump .jt{font-weight:500;font-size:14.5px;display:block}
  .jump .jd{color:var(--muted);font-size:12px;margin-top:2px;display:block}
  .jump .arw{font-size:20px;color:var(--coral)}
  .caps{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
        color:var(--muted);margin:26px 0 10px}
  .tiles{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
  @media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
        padding:15px 16px 16px}
  .tile .ix{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
  .tile .n{font-weight:300;font-size:38px;line-height:1;letter-spacing:-.04em;margin-top:8px;
           font-variant-numeric:tabular-nums;display:block}
  .tile .t{color:var(--muted);font-size:12.5px;margin-top:6px;display:block}
  .tile.alert .n{color:var(--red)}
  h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
     font-weight:500;margin:38px 0 12px}
  h2 .c{color:var(--red);margin-left:7px}
  h3{font-size:14.5px;font-weight:500;margin:0 0 9px;display:flex;align-items:baseline;gap:8px;
     flex-wrap:wrap}
  h3 .n{font-family:var(--mono);font-size:11px;color:var(--cream);background:var(--ink);
        border-radius:999px;padding:2px 8px}
  h3 .n.zero{background:var(--rule);color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:4px}
  .pad{padding:18px 20px}
  .split{display:grid;gap:18px;grid-template-columns:1fr 1fr;margin-top:12px;align-items:start}
  @media(max-width:960px){.split{grid-template-columns:1fr}}
  .side{border:1px solid var(--rule);border-radius:6px;background:var(--surface);overflow:hidden}
  .side .hd{padding:16px 20px 14px;border-bottom:1px solid var(--rule);display:flex;
            justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .side.alma .hd{background:#F0DCCB}
  .side.nbr .hd{background:#E3E7EF}
  .side .hd h2{margin:0;font-size:19px;letter-spacing:-.01em;text-transform:none;color:var(--ink);
               font-weight:500}
  .side .hd .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .side .hd .big{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;
                 line-height:1.6}
  .side .hd .big b{color:var(--ink);font-size:20px;font-weight:300;letter-spacing:-.03em}
  .blk{padding:16px 20px;border-bottom:1px solid var(--rule)}
  .blk:last-child{border-bottom:0}
  .blk .note{margin-top:8px}
  ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
  .fi{border-left:3px solid var(--rule);padding-left:11px}
  .fi.act{border-left-color:var(--red)}
  .fi.warn{border-left-color:var(--olive)}
  .fi.info{border-left-color:var(--sky)}
  .fi .t{display:block;font-size:14px}
  .fi .d{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
  .fi .w{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
  .fi .mv{display:block;font-size:12.5px;margin-top:3px;color:var(--red)}
  .bkh{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
       color:var(--muted);margin:14px 0 7px}
  .bkh:first-child{margin-top:0}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
     color:var(--muted);padding:9px 10px;background:var(--panel);white-space:nowrap}
  td{padding:9px 10px;border-top:1px solid var(--rule);vertical-align:top}
  tr.unseen td{background:#FFF3EE}
  .mono{font-family:var(--mono);font-size:12.5px}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .crit{color:var(--red);font-weight:500}
  .dim{color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;color:#fff;
        white-space:nowrap;font-weight:500}
  .new{background:var(--coral);color:#fff;padding:1px 7px;border-radius:999px;font-size:10px;
       margin-left:6px;font-family:var(--mono);letter-spacing:.05em}
  .empty{padding:14px 0;color:var(--muted);font-size:13.5px}
  .note{color:var(--muted);font-size:12.5px;line-height:1.7;margin-top:12px}
  .note a,.blk a{color:var(--red)}
  button.wa{font:inherit;font-size:12px;padding:4px 10px 4px 8px;border-radius:999px;cursor:pointer;
            border:1px solid var(--green);background:#fff;color:var(--green);white-space:nowrap;
            display:inline-flex;align-items:center;gap:5px;vertical-align:middle;margin-left:6px}
  button.wa:hover{background:var(--green);color:#fff}
  button.wa svg{width:13px;height:13px;fill:currentColor}
  button.wa.nocontact{border-style:dashed}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .thumbs a{display:block;width:72px;height:72px;border-radius:4px;overflow:hidden;
            border:1px solid var(--rule);background:var(--panel)}
  .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .pgrid .ph{font-size:12.5px}
  .pgrid .ph .nm{font-weight:500;display:block;margin-bottom:4px}
  .pgrid .thumbs a{width:100%;height:110px}
  .two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
  @media(max-width:760px){.two{grid-template-columns:1fr}}
  .crow{display:grid;grid-template-columns:minmax(0,auto) 1fr 32px;gap:11px;align-items:center;
        padding:6px 0}
  .ctrack{height:9px;background:var(--panel);border-radius:2px;overflow:hidden}
  .ctrack div{height:100%}
  .chart{display:flex;align-items:flex-end;gap:6px;height:104px;padding-top:6px}
  .wbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;
        min-width:0;gap:5px}
  .wbar>div{background:var(--sky);border-radius:2px 2px 0 0;min-height:2px}
  .wbar span{text-align:center;font-size:10px;color:var(--muted)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
  select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--rule);
         border-radius:7px;background:var(--surface);color:var(--ink)}
  .todo li{display:flex;align-items:flex-start;gap:12px;padding:12px 18px;
           border-bottom:1px solid var(--rule)}
  .todo li:last-child{border-bottom:0}
  .todo .tx{flex:1;min-width:0}
  .todo .done .tx{text-decoration:line-through;color:var(--muted)}
  .todo .wh{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
  .todo .tick{width:17px;height:17px;flex:none;margin-top:3px;border:1.5px solid var(--rule);
              border-radius:3px;display:inline-block}
  .todo .done .tick{background:var(--red);border-color:var(--red)}
  .addrow{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--rule);flex-wrap:wrap}
  .addrow a.edit{font-size:13px;color:var(--red);text-decoration:none}
  .addrow a.edit:hover{text-decoration:underline}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);
         color:var(--cream);padding:11px 18px;border-radius:8px;font-size:13.5px;max-width:92vw;
         box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:1}
  .toast a{color:var(--coral)}
  footer{border-top:1px solid var(--rule);margin-top:44px;padding-block:18px 0;
         color:var(--muted);font-size:12px;line-height:1.7}
  footer a{color:var(--red)}
</style>
</head>
<body>

<div class="band"><div class="in mast">
  <h1>Fire Alarm Board</h1>
  <div class="right">
    <span class="fresh" id="fresh"></span>
    <label class="auto"><input type="checkbox" id="autoref" checked> auto</label>
    <button class="rf" id="refresh" type="button">Refresh</button>
  </div>
</div></div>

<main class="in">
  <div class="jump" id="jump"></div>

  <div class="caps" id="caps"></div>
  <div class="tiles" id="tiles" role="group" aria-label="At a glance"></div>

  <div class="split">
    <section class="side alma" id="alma" aria-label="Alma House"></section>
    <section class="side nbr" id="nbr" aria-label="New Bahru"></section>
  </div>

  <div id="estate"></div>

  <h2>My to-do list</h2>
  <div class="card">
    <ul class="todo" id="todo" style="list-style:none;margin:0;padding:0"></ul>
    <div class="addrow" style="justify-content:flex-end">
      <a href="https://script.google.com/a/macros/newbahru.com/s/AKfycbwpaCz686Yd8tspbuNAqXhD25QZy1AfbK8dGGZun3hdHlpcJ9GncEi-_c-kRrP9iAA5xQ/exec" target="_blank" rel="noopener" class="edit">Edit the list in the live board &rarr;</a>
    </div>
  </div>

  <div class="two" style="margin-top:34px">
    <div class="card pad">
      <h2 style="margin-top:0">What caused them &mdash; last 30 days, whole estate</h2>
      <div id="cats"></div>
    </div>
    <div class="card pad">
      <h2 style="margin-top:0">Activations per week &mdash; last 10 weeks, whole estate</h2>
      <div class="chart" id="wk"></div>
    </div>
  </div>

  <h2>Every activation</h2>
  <div class="controls">
    <select id="fArea"><option value="">Everywhere</option><option>Alma House</option><option>NBR</option></select>
    <select id="fCat"><option value="">Every category</option></select>
    <select id="fDays">
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="120">Last 120 days</option>
    </select>
  </div>
  <div class="card scroll" id="tbl"></div>

  <footer id="foot"></footer>
</main>

/* ---------- helpers ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];

}
function colour(cat) { return COLOUR[cat] || 'var(--wheat)'; }
function pill(cat) {

/* Same rule as fa-publish.loc_token: the part of a location people actually type. */
function tok(s) {
  s = String(s || '');
  var m = s.match(/#\s*0?(\d{1,2})-(\d{2}(?:\/\d{2})?)/);
  if (m) return '#' + ('0' + m[1]).slice(-2) + '-' + m[2];
  m = s.match(/#\s*(\d{3})\b/);
  if (m) return '#' + m[1];
  m = s.match(/\bZA\s*(\d{2})-(\d{2})\b/i);
  if (m) return 'za' + m[1] + '-' + m[2];
  return s.trim().toLowerCase().replace(/\s+/g, ' ');
}
function tenant(where) { var i = where.indexOf(' — '); return i < 0 ? '' : where.slice(i + 3); }
function dmy(iso) {           /* 2026-11-07 -> 07 Nov */
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  if (!m) return iso || '';
  return m[3] + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2] - 1];
}

  if (isPhone) {
    if (digits.length === 8) digits = '65' + digits;
    window.open('https://wa.me/' + digits + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
    return;
  }
  if (/^https?:\/\/(api\.whatsapp\.com|wa\.me)\//i.test(link) && !/text=/.test(link)) {
    window.open(link + (link.indexOf('?') < 0 ? '?' : '&') + 'text=' + encodeURIComponent(text), '_blank', 'noopener');
    return;
  }
  copyText(text, function (ok) {
    if (link) {
      toast((ok ? 'Notice copied. Paste it into the chat.' : 'Could not copy automatically.') + ' Opening the group…');
      window.open(link, '_blank', 'noopener');
    } else {
      toast((ok ? 'Notice copied to your clipboard. ' : 'Could not copy automatically. ') +
        'No contact for this unit yet — add the group link or number in the ' +
        '<a href="' + esc(LINK.contacts) + '" target="_blank" rel="noopener">Contacts</a> tab.');
    }
  });
}

/* ---------- estate-wide charts and table ---------- */
function cats() {
  var r = DATA.acts.filter(function (a) { return a.ago <= 30; });
  var by = {};
  r.forEach(function (a) { by[a.cat] = (by[a.cat] || 0) + 1; });
  var keys = Object.keys(by).sort(function (x, y) { return by[y] - by[x]; });
  var tot = r.length || 1;
  document.getElementById('cats').innerHTML = keys.map(function (k) {
    return '<div class="crow"><span>' + esc(k) + '</span>' +
      '<div class="ctrack"><div style="width:' + (by[k] / tot * 100).toFixed(1) + '%;background:' + colour(k) + '"></div></div>' +
      '<span class="mono num">' + by[k] + '</span></div>';
  }).join('') || '<div class="empty">Nothing in the last 30 days.</div>';
}
function weeks() {
  var b = [], w;
  for (w = 9; w >= 0; w--) {
    b.push(DATA.acts.filter(function (a) { return Math.floor(a.ago / 7) === w; }).length);
  }
  var mx = Math.max.apply(null, b.concat([1]));
  document.getElementById('wk').innerHTML = b.map(function (n) {
    return '<div class="wbar"><div style="height:' + Math.round(n / mx * 100) + '%"></div>' +
      '<span class="mono">' + (n || '') + '</span></div>';
  }).join('');
}
function table() {
  var area = document.getElementById('fArea').value;
  var cat = document.getElementById('fCat').value;
  var days = +document.getElementById('fDays').value || 30;
  var r = DATA.acts.filter(function (a) {
    return (!area || a.area === area) && (!cat || a.cat === cat) && a.ago <= days;
  });
  var el = document.getElementById('tbl');
  if (!r.length) { el.innerHTML = '<div class="empty" style="padding:20px">Nothing matches.</div>'; return; }
  el.innerHTML = '<table style="min-width:560px"><tr><th>Date</th><th>Time</th><th>Area</th><th>Location</th><th>Cause</th><th>Category</th></tr>' +
    r.map(function (a) {
      return '<tr' + (unseen(a) ? ' class="unseen"' : '') + '><td class="mono">' + esc(a.date) + (unseen(a) ? '<span class="new">NEW</span>' : '') +
        '</td><td class="mono">' + esc(a.time) + '</td><td>' + esc(a.area) + '</td><td>' + esc(a.where) +
        '</td><td>' + esc(a.cause) + '</td><td>' + pill(a.cat) + '</td></tr>';
    }).join('') + '</table>';
}
function todo() {
  var el = document.getElementById('todo');
  var t = DATA.todo || [];
  if (!t.length) {
    el.innerHTML = '<li style="color:var(--muted);padding:16px 18px">Nothing on your list. Add to it in the live board.</li>';
    return;
  }
  var openFirst = t.filter(function (x) { return !x.done; }).concat(t.filter(function (x) { return x.done; }));
  el.innerHTML = openFirst.map(function (x) {
    return '<li class="' + (x.done ? 'done' : '') + '"><span class="tick"></span>' +
      '<span class="tx">' + esc(x.task) + (x.where ? '<span class="wh">' + esc(x.where) + '</span>' : '') + '</span></li>';
  }).join('');
}

function draw() {
  tiles();
  SIDES.forEach(function (sd) { document.getElementById(sd.id).innerHTML = sideHtml(sd); });
  estate(); cats(); weeks(); table();
}

(function () {
  var btn = document.getElementById('refresh');
  var auto = document.getElementById('autoref');
  var timer = null;
  function go() { btn.disabled = true; btn.textContent = 'Refreshing'; location.reload(); }
  btn.onclick = go;
  function arm() {
    if (timer) { clearInterval(timer); }
    if (auto.checked) { timer = setInterval(go, AUTO_MIN * 60000); }
    try { localStorage.setItem('fa-auto', auto.checked ? '1' : '0'); } catch (e) {}
  }
  try { if (localStorage.getItem('fa-auto') === '0') { auto.checked = false; } } catch (e) {}
  auto.onchange = arm;
  arm();

  var cs = [];
  DATA.acts.forEach(function (a) { if (a.cat && cs.indexOf(a.cat) < 0) { cs.push(a.cat); } });
  cs.sort();
  document.getElementById('fCat').innerHTML = '<option value="">Every category</option>' +
    cs.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
  ['fArea', 'fCat', 'fDays'].forEach(function (id) { document.getElementById(id).onchange = table; });

  /* one listener for every WhatsApp button, now and after redraws */
  if (document.addEventListener) {
    document.addEventListener('click', function (ev) {
      var b = ev.target;
      while (b && b !== document && !(b.getAttribute && b.getAttribute('data-n') !== null && b.getAttribute('data-n') !== '')) { b = b.parentNode; }
      if (b && b !== document && b.getAttribute) { waOpen(+b.getAttribute('data-n')); }
    });
  }

  head(); todo(); draw();
  /* mark everything on this build as seen for next time, after it has been drawn */
  rememberSeen();
})();
</script>
